<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员 · 授权码管理</title>
<style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;max-width:850px;padding:22px;margin:auto}.card{background:#222;border:1px solid #333;border-radius:12px;padding:18px;margin:16px 0}input,select,button{width:100%;padding:12px;margin:6px 0;background:#333;color:#fff;border:1px solid #555;border-radius:7px;box-sizing:border-box}button{background:#ff3366;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#444}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:8px;border:1px solid #444;text-align:left;font-size:13px}.ok{color:#0f8}.bad{color:#f66}</style></head><body><h2>🔐 授权码管理中心</h2>
<section class="card"><h3>批量生成授权码</h3><input id="password" type="password" placeholder="管理员密码"><input id="count" type="number" min="1" max="100" value="10"><select id="attempts"><option value="1">1次</option><option value="2">2次</option><option value="3">3次</option><option value="5">5次</option></select><button id="gen" onclick="generate()">生成</button><div id="generated"></div></section>
<section class="card"><h3>查询单个授权码</h3><input id="singleCode" maxlength="6" placeholder="6位授权码"><button onclick="single()">查询</button><div id="singleResult"></div></section>
<section class="card"><h3>全部授权码</h3><button class="secondary" onclick="all()">刷新列表</button><div id="allResult"></div></section>
<script>
async function call(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||"请求失败");return d}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function generate(){const b=document.getElementById("gen");b.disabled=true;try{const d=await call("/api/generate",{password:password.value,count:+count.value,attempts:+attempts.value});generated.innerHTML="<p class='ok'>生成成功</p><table><tr><th>授权码</th><th>次数</th><th>创建时间</th></tr>"+d.codes.map(x=>`<tr><td>${esc(x.code)}</td><td>${x.max}</td><td>${esc(x.created)}</td></tr>`).join("")+"</table>"}catch(e){alert(e.message)}finally{b.disabled=false}}
async function single(){try{const d=await call("/api/query",{password:password.value,code:singleCode.value});singleResult.innerHTML=`<p>授权码：${esc(d.data.code)}；总次数：${d.data.max}；已用：${d.data.used}；剩余：${d.data.remaining}</p>`}catch(e){alert(e.message)}}
async function all(){try{const d=await call("/api/query",{password:password.value});allResult.innerHTML="<table><tr><th>授权码</th><th>总/已用/剩余</th><th>创建时间</th></tr>"+d.list.map(x=>`<tr><td>${esc(x.code)}</td><td>${x.max}/${x.used}/${x.remaining}</td><td>${esc(x.created)}</td></tr>`).join("")+"</table>"}catch(e){alert(e.message)}}
</script></body></html>
