<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>日本女优气质原型匹配系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
.wrap { max-width: 520px; margin: auto; padding: 22px; min-height: 100vh; }
.hidden { display: none !important; }

h1 { font-size: 26px; line-height: 1.3; background: linear-gradient(135deg, #9333ea, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { color: #999; line-height: 1.65; }
.hero { text-align: center; padding: 34px 0; }

input, button { width: 100%; padding: 14px; border-radius: 11px; border: 1px solid #333; background: #171717; color: #fff; font-size: 15px; margin: 7px 0; transition: all 0.2s ease; }
button { background: linear-gradient(135deg, #9333ea, #c084fc); border: 0; font-weight: 700; cursor: pointer; }
button:hover { opacity: 0.9; transform: translateY(-1px); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card, .option, .panel { background: #151515; border: 1px solid #292929; border-radius: 12px; padding: 15px; transition: all 0.2s ease; }
.card { text-align: center; cursor: pointer; }
.card:hover { border-color: #c084fc; background: #1a1025; }
.card b { color: #d8b4fe; }
.muted { color: #888; font-size: 12px; }

.progress { height: 5px; background: #292929; border-radius: 5px; margin: 18px 0; }
.fill { height: 100%; background: linear-gradient(90deg, #9333ea, #c084fc); width: 0; transition: width 0.3s ease; }

.option { display: block; width: 100%; text-align: left; line-height: 1.5; margin: 10px 0; cursor: pointer; }
.option:hover { border-color: #c084fc; }
.option.sel { border-color: #c084fc; background: #2e1065; }

.row { display: flex; gap: 10px; }
.row button { flex: 1; }

.poster { 
  background: #151515; 
  border: 1px solid #333; 
  border-radius: 18px; 
  padding: 24px; 
  margin: 18px 0; 
  min-height: 80vh; 
  box-shadow: 0 10px 40px rgba(147, 51, 234, 0.08); 
}
.kicker { text-align: center; color: #d8b4fe; letter-spacing: 2px; font-size: 12px; }
.winner { 
  text-align: center; 
  font-size: 29px; 
  font-weight: 900; 
  margin: 18px 0; 
  background: linear-gradient(135deg, #e9d5ff, #c084fc); 
  -webkit-background-clip: text; 
  -webkit-text-fill-color: transparent; 
}

.score { height: 9px; background: #292929; border-radius: 8px; overflow: hidden; margin: 8px 0; }
.score i { display: block; height: 100%; background: linear-gradient(90deg, #9333ea, #c084fc); transition: width 0.5s ease; }

.dim { padding: 12px 0; border-bottom: 1px solid #292929; }
.dim small { color: #999; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 15px; }
.tabs button { width: auto; padding: 8px 14px; font-size: 12px; background: #171717; color: #d8b4fe; margin: 0; border: 1px solid #292929; border-radius: 8px; cursor: pointer; }
.tabs button:hover { background: #2e1065; border-color: #c084fc; }

a { color: #d8b4fe; text-decoration: none; transition: color 0.2s; }
a:hover { color: #fff; text-decoration: underline; }
.note { font-size: 11px; color: #777; margin-top: 10px; }
.ghost{background:#1a1a1a !important;border:1px solid #333 !important;color:#d8b4fe !important}
.ghost:hover{background:#2e1065 !important;border-color:#c084fc !important}
.tabs button.on{background:#2e1065;border-color:#c084fc;color:#fff}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.moreBtn{display:block;text-align:center;padding:14px;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;font-weight:700;text-decoration:none}
.moreBtn:hover{opacity:.9}
#modal,#copyModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#modalScroll{width:92%;max-width:420px;max-height:70vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
#modalScroll img{width:100%;border-radius:12px}
.closeX{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.modalTip{color:#d8b4fe;font-size:14px;font-weight:bold;margin:0 0 12px;text-align:center}
#copyArea{width:92%;max-width:420px;height:150px;background:#151515;color:#fff;border:1px solid #9333ea;border-radius:10px;padding:12px;font-size:13px;line-height:1.6}
#copyBtn{width:auto;max-width:200px;margin-top:12px}
</style>
</head>
<body>
<main class="wrap">
  <section id="entry">
    <div class="hero">
      <h1>✨ 日本女优气质原型匹配</h1>
      <p>30道代际专属情境题 · 六维偏好画像 · 综合原型与维度冠军</p>
      <input id="code" maxlength="6" placeholder="输入6位授权码" autocomplete="off">
      <button id="start">验证授权码</button>
      <div id="msg" class="muted" style="min-height:18px;margin-top:10px;"></div>
    </div>
  </section>

  <section id="choose" class="hidden">
    <h1>选择测试代际</h1>
    <p id="remain" style="color:#c084fc;font-weight:bold;"></p>
    <div class="grid" id="genCards"></div>
    <button id="viewResultBtn" class="ghost hidden">📂 查看已测代际结果</button>
    <p class="note">按女优首次正式出道的大致年份划分。候选人均为成年公众人物；人物原型是娱乐性风格类比，不代表真人性格或私生活。</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="muted">第 <span id="num">1</span> / 30 题</div>
    <div class="progress"><div id="fill" class="fill"></div></div>
    <h2 id="question" style="font-size:18px;line-height:1.5;margin-bottom:20px;"></h2>
    <div id="options"></div>
    <div class="row">
      <button id="prev" class="ghost">上一题</button>
      <button id="next">下一题</button>
    </div>
  </section>

  <section id="confirm" class="hidden">
    <div class="hero">
      <div style="font-size:56px;margin-bottom:10px;">🎯</div>
      <h1>你已完成全部 30 题</h1>
      <p>系统将解析你的六维偏好向量，在候选原型中匹配你的本命原型。</p>
      <button id="calcBtn">开始测算</button>
      <button id="backQuizBtn" class="ghost">返回检查答案</button>
    </div>
  </section>

  <section id="calc" class="hidden">
    <div class="hero">
      <div style="font-size:56px;margin-bottom:10px;">💫</div>
      <h1>正在生成你的专属档案</h1>
      <div class="progress"><div id="calcFill" class="fill"></div></div>
      <div id="calcText" class="muted" style="color:#c084fc;">正在解析你的 30 个选择...</div>
      <div id="calcPct" class="muted" style="margin-top:6px;">0%</div>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="tabs" id="resultTabs"></div>
    <div id="posters"></div>
    <div class="actions">
      <button id="saveBtn">📸 保存结果为图片</button>
      <button id="shareBtn" class="ghost">🔗 分享测试结果</button>
      <button id="againBtn" class="ghost">🔄 返回测试页</button>
      <a class="moreBtn" href="https://allshop-djt.pages.dev/">🛒 更多测试</a>
    </div>
  </section>
</main>

<div id="modal">
  <span class="closeX" onclick="closeModal()">×</span>
  <p class="modalTip">👇 长按图片保存到相册 👇</p>
  <div id="modalScroll"></div>
</div>

<div id="copyModal">
  <span class="closeX" onclick="closeCopy()">×</span>
  <p class="modalTip">👇 复制下面文案发给朋友 👇</p>
  <textarea id="copyArea" readonly></textarea>
  <button id="copyBtn">一键复制</button>
</div>
</main>

let code = "", remaining = 0, currentGen = "", qIndex = 0, answers = [], serverResults = [], curIdx = 0;
const $ = id => document.getElementById(id);

async function api(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || ("请求失败 HTTP " + r.status));
  return d;
}

function show(id) {
  ["entry", "choose", "quiz", "confirm", "calc", "result"].forEach(function (x) { $(x).classList.toggle("hidden", x !== id); });
  window.scrollTo(0, 0);
}

function genLabel(g) {
  const i = Number(String(g).replace("gen", "")) - 1;
  return (genInfo[i] && genInfo[i].name) || String(g);
}

function normResult(r) {
  r = r || {};
  const w = (r.winner && typeof r.winner === "object") ? r.winner : { name: String(r.winner || "未知原型"), desc: "", summary: "", detail: "" };
  const sc = Array.isArray(r.scores) ? r.scores : [0, 0, 0, 0, 0, 0];
  const ch = Array.isArray(r.champions) ? r.champions.map(function (c) {
    return (c && typeof c === "object") ? c : { name: String(c || "—"), desc: "", summary: "", detail: "" };
  }) : [];
  const rn = (r.runner && typeof r.runner === "object") ? r.runner : { name: r.runner ? String(r.runner) : "—", gap: null };
  return { w: w, sc: sc, ch: ch, rn: rn };
}

function buildPosters(r, label, times) {
  const n = normResult(r), w = n.w, sc = n.sc, ch = n.ch, rn = n.rn;
  const maxIdx = sc.indexOf(Math.max.apply(null, sc));
  let h = "";
  h += '<article class="poster">';
  h += '<div class="kicker">YOUR ARCHETYPE · ' + label + ' · 第 ' + times + ' 次</div>';
  h += '<div class="winner">' + w.name + '</div>';
  if (w.desc) h += '<p style="text-align:center;color:#d8b4fe;font-weight:bold;margin:0 0 12px">' + w.desc + '</p>';
  if (w.summary) h += '<p style="text-align:center;color:#ccc;">' + w.summary + '</p>';
  h += '<h3 style="margin-top:25px;color:#d8b4fe;">你的六维偏好画像</h3>';
  for (let i = 0; i < 6; i++) {
    h += '<div class="dim"><b>' + dims[i].name + '</b>'
      + '<span style="float:right;color:#c084fc;font-weight:bold;">' + sc[i] + '分</span>'
      + '<div class="score"><i style="width:' + sc[i] + '%"></i></div>'
      + '<small>' + dims[i].desc + '</small></div>';
  }
  h += '<p class="note">第二接近原型：<strong>' + rn.name + '</strong>' + ((rn.gap !== null && rn.gap !== undefined) ? '。两者距离差：' + rn.gap : '') + '。</p>';
  h += '<p class="note">匹配算法根据你的答题向量与候选原型向量计算相似度，结果仅供娱乐参考。</p>';
  h += '</article>';

  h += '<article class="poster"><div class="kicker">DIMENSION CHAMPIONS</div><div class="winner">六维专属原型榜</div>';
  for (let j = 0; j < 6; j++) {
    const c = ch[j] || { name: "—", desc: "", summary: "", detail: "" };
    h += '<div class="dim"><b>' + dims[j].name + '</b>'
      + '<div class="winner" style="font-size:22px;text-align:left;margin:10px 0;">' + c.name + '</div>'
      + '<small style="color:#d8b4fe">' + (c.desc || dims[j].desc) + '</small>'
      + ((c.detail || c.summary) ? '<p style="margin-top:8px;color:#ccc;">' + (c.detail || c.summary) + '</p>' : '')
      + '</div>';
  }
  h += '</article>';

  h += '<article class="poster"><div class="kicker">YOUR PROFILE</div><div class="winner">你的魅力画像</div>';
  h += '<p style="color:#ccc;line-height:1.7;">' + (w.detail || w.summary || "暂无详细画像") + '</p>';
  h += '<p style="margin-top:15px;color:#ccc;">你的突出维度是<strong style="color:#c084fc;">' + dims[maxIdx].name + '</strong>。这代表你在相应情境选择中更常采用该维度对应的策略。</p>';
  h += '<p class="note">娱乐性自我探索内容，不用于判断他人或作现实决策。</p>';
  h += '</article>';
  return h;
}

function renderGenCards() {
  $("genCards").innerHTML = genInfo.map(function (g, i) {
    const n = i + 1;
    return '<div class="card" onclick="chooseGen(\'gen' + n + '\')">'
      + '<b>' + g.name + ' · ' + g.tag + '</b>'
      + '<p class="muted">' + g.years + '</p>'
      + '<span class="muted">30道专属题</span>'
      + '<p><a href="gen' + n + '.html" onclick="event.stopPropagation()">查看候选池</a></p>'
      + '</div>';
  }).join("");
}

function gotoChoose() {
  $("remain").textContent = "该授权码剩余测试次数：" + remaining;
  renderGenCards();
  $("viewResultBtn").classList.toggle("hidden", serverResults.length === 0);
  show("choose");
}

$("start").onclick = async function () {
  code = $("code").value.trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) {
    $("msg").textContent = "请输入6位授权码";
    $("msg").style.color = "#f87171";
    return;
  }
  $("start").disabled = true;
  $("msg").textContent = "验证中...";
  $("msg").style.color = "#d8b4fe";
  try {
    const d = await api("/api/check", { code: code });
    remaining = d.remaining || 0;
    serverResults = Array.isArray(d.results) ? d.results : [];
    if (remaining > 0) {
      gotoChoose();
      $("msg").textContent = "";
    } else if (serverResults.length > 0) {
      showResultView();
    } else {
      $("msg").textContent = "该授权码次数已用完，且无历史记录";
      $("msg").style.color = "#f87171";
    }
  } catch (e) {
    $("msg").textContent = "验证失败: " + e.message;
    $("msg").style.color = "#f87171";
  } finally {
    $("start").disabled = false;
  }
};

$("code").addEventListener("input", function (e) {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});

$("viewResultBtn").onclick = function () { showResultView(); };

function chooseGen(gen) {
  if (remaining <= 0) { alert("测试次数已用完，无法再次测试"); return; }
  currentGen = gen;
  qIndex = 0;
  answers = new Array(30).fill(null);
  renderQ();
  show("quiz");
}

function renderQ() {
  const q = questions[currentGen][qIndex];
  $("num").textContent = qIndex + 1;
  $("fill").style.width = ((qIndex + 1) / 30 * 100) + "%";
  $("question").textContent = q.q;
  $("options").innerHTML = q.opts.map(function (o, i) {
    return '<button class="option ' + (answers[qIndex] === i ? "sel" : "") + '" onclick="pick(' + i + ')">'
      + String.fromCharCode(65 + i) + '. ' + o.t + '</button>';
  }).join("");
  $("prev").disabled = (qIndex === 0);
  $("next").textContent = (qIndex === 29) ? "提交答案" : "下一题";
  $("next").disabled = (answers[qIndex] === null);
}

function pick(i) { answers[qIndex] = i; renderQ(); }

$("prev").onclick = function () { if (qIndex > 0) { qIndex--; renderQ(); } };
$("next").onclick = function () {
  if (answers[qIndex] === null) return;
  if (qIndex < 29) { qIndex++; renderQ(); } else { show("confirm"); }
};

$("backQuizBtn").onclick = function () { qIndex = 29; renderQ(); show("quiz"); };
$("calcBtn").onclick = function () { startCalc(); };

function startCalc() {
  show("calc");
  const steps = ["正在解析你的 30 个选择...", "构建六维偏好向量场...", "扫描候选原型图谱...", "计算多维空间共振频率...", "生成专属档案海报..."];
  let p = 0, last = -1;
  $("calcFill").style.width = "0%";
  $("calcPct").textContent = "0%";
  $("calcText").textContent = steps[0];
  const iv = setInterval(function () {
    p += 100 / 30;
    if (p >= 100) {
      clearInterval(iv);
      $("calcFill").style.width = "100%";
      $("calcPct").textContent = "100%";
      setTimeout(finish, 300);
      return;
    }
    $("calcFill").style.width = p + "%";
    $("calcPct").textContent = Math.floor(p) + "%";
    const si = Math.min(steps.length - 1, Math.floor(p / 100 * steps.length));
    if (si !== last) { $("calcText").textContent = steps[si]; last = si; }
  }, 100);
}

function calcScores() {
  const totals = new Array(6).fill(0), maxes = new Array(6).fill(0);
  answers.forEach(function (a, i) {
    const q = questions[currentGen][i];
    totals[q.dim] += q.opts[a].v;
    maxes[q.dim] += 10;
  });
  return totals.map(function (v, i) { return Math.round(v / (maxes[i] || 50) * 100); });
}

function distance(a, b) {
  const weights = [1.15, 1.1, 1.05, 1.1, 1, 1.15];
  let sum = 0, den = 0;
  for (let i = 0; i < 6; i++) {
    sum += weights[i] * Math.pow(a[i] - b[i] * 10, 2);
    den += weights[i];
  }
  return Math.sqrt(sum / den);
}

function match(scores) {
  const list = people[currentGen];
  const ranked = list.map(function (p) { return { p: p, dist: distance(scores, p.scores) }; }).sort(function (a, b) { return a.dist - b.dist; });
  const championByDim = dims.map(function (d, i) {
    return list.map(function (p) { return { p: p, delta: Math.abs(scores[i] - p.scores[i] * 10) }; })
      .sort(function (a, b) { return a.delta - b.delta; })[0].p;
  });
  return { winner: ranked[0], runner: ranked[1], championByDim: championByDim };
}

async function finish() {
  if (answers.some(function (x) { return x === null; })) { alert("还有题目未作答"); show("quiz"); return; }
  const scores = calcScores(), m = match(scores), p = m.winner.p;
  const payload = {
    scores: scores,
    winner: { name: p.name, desc: p.desc, summary: p.summary, detail: p.detail },
    runner: { name: m.runner.p.name, gap: Number((m.runner.dist - m.winner.dist).toFixed(2)) },
    champions: m.championByDim.map(function (x) { return { name: x.name, desc: x.desc, summary: x.summary, detail: x.detail }; }),
    timestamp: new Date().toISOString()
  };
  try {
    const d = await api("/api/save", { code: code, gen: currentGen, resultData: payload });
    remaining = (typeof d.remaining === "number") ? d.remaining : Math.max(0, remaining - 1);
    serverResults.push({ gen: currentGen, result: d.result || payload });
  } catch (e) {
    alert("保存失败：" + e.message);
    gotoChoose();
    return;
  }
  showResultView();
}

function showResultView() {
  if (!serverResults.length) { alert("暂无已测结果"); return; }
  curIdx = serverResults.length - 1;
  renderResultTabs();
  renderCurrentResult();
  show("result");
}

function renderResultTabs() {
  $("resultTabs").innerHTML = serverResults.map(function (rec, i) {
    return '<button class="' + (i === curIdx ? "on" : "") + '" onclick="switchResult(' + i + ')">第 ' + (i + 1) + ' 次 · ' + genLabel(rec.gen) + '</button>';
  }).join("");
}

function switchResult(i) {
  curIdx = i;
  renderResultTabs();
  renderCurrentResult();
  window.scrollTo(0, 0);
}

function renderCurrentResult() {
  const rec = serverResults[curIdx];
  if (!rec) return;
  $("posters").innerHTML = buildPosters(rec.result, genLabel(rec.gen), curIdx + 1);
}

async function captureEl(el) {
  const om = el.style.minHeight, oh = el.style.height;
  el.style.minHeight = "0";
  el.style.height = "auto";
  try {
    const cv = await html2canvas(el, { scale: 2, backgroundColor: "#151515", useCORS: true, logging: false });
    return cv.toDataURL("image/png");
  } finally {
    el.style.minHeight = om;
    el.style.height = oh;
  }
}

$("saveBtn").onclick = async function () {
  const btn = this, old = btn.textContent;
  const cards = document.querySelectorAll("#posters .poster");
  if (!cards.length) return;
  btn.disabled = true;
  btn.textContent = "⏳ 生成图片中...";
  try {
    const imgs = [];
    for (let i = 0; i < cards.length; i++) { imgs.push(await captureEl(cards[i])); }
    const mobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (mobile) {
      $("modalScroll").innerHTML = imgs.map(function (d, i) {
        return '<img src="' + d + '" alt="结果' + (i + 1) + '"><small style="color:#888;text-align:center;display:block">第 ' + (i + 1) + ' 张 / 共 ' + imgs.length + ' 张</small>';
      }).join("");
      $("modal").style.display = "flex";
    } else {
      imgs.forEach(function (d, i) {
        const a = document.createElement("a");
        a.download = "jav-archetype-" + (curIdx + 1) + "-" + (i + 1) + ".png";
        a.href = d;
        a.click();
      });
    }
  } catch (e) {
    alert("生成图片失败，请尝试手动截图");
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
};

function closeModal() { $("modal").style.display = "none"; }
function closeCopy() { $("copyModal").style.display = "none"; }

$("shareBtn").onclick = function () {
  const rec = serverResults[curIdx];
  const n = normResult(rec ? rec.result : null);
  const url = location.origin + "/share.html?code=" + encodeURIComponent(code);
  $("copyArea").value = '我的测试结果是"' + (n.w.desc || n.w.name) + '"。' + (n.w.summary || "") + ' 我的测试结果：' + url;
  $("copyModal").style.display = "flex";
  setTimeout(function () { const t = $("copyArea"); t.focus(); t.select(); }, 50);
};

$("copyBtn").onclick = function () {
  const t = $("copyArea");
  t.focus();
  t.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t.value).then(function () { alert("✅ 已复制，粘贴发给朋友即可"); }).catch(function () { alert("请长按文本框手动复制"); });
  } else {
    alert("请长按文本框手动复制");
  }
};

$("againBtn").onclick = function () {
  if (remaining > 0) { gotoChoose(); } else { location.reload(); }
};
</script>
