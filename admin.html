<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>管理员 - 授权码管理</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #0a0a0a; color: #fff; padding: 20px; max-width: 850px; margin: 0 auto; }
    h2 { background: linear-gradient(135deg, #9333ea, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
    .card { background: #151515; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2a2a2a; }
    label { display: block; font-size: 13px; color: #d8b4fe; margin-bottom: 6px; font-weight: 500; }
    input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 8px; border: 1px solid #333; background: #171717; color: #fff; font-size: 14px; box-sizing: border-box; transition: all 0.2s ease; }
    input:focus, select:focus { border-color: #c084fc; outline: none; }
    button { background: linear-gradient(135deg, #9333ea, #c084fc); border: none; cursor: pointer; font-weight: bold; margin-top: 15px; }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-sec { background: #1a1a1a; border: 1px solid #333; color: #d8b4fe; }
    .btn-sec:hover { background: #2e1065; border-color: #c084fc; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #151515; border-radius: 8px; overflow: hidden; }
    th, td { border-bottom: 1px solid #2a2a2a; padding: 10px; text-align: left; font-size: 13px; }
    th { background: #1a1a1a; color: #c084fc; font-weight: 600; }
    tr:hover td { background: rgba(147, 51, 234, 0.05); }
    .code { font-family: monospace; letter-spacing: 1px; background: #2e1065; color: #e9d5ff; padding: 2px 6px; border-radius: 4px; }
    .ok { color: #a78bfa; font-weight: 600; } 
    .no { color: #f87171; font-weight: 600; }
  </style>
</head>
<body>
  <h2>🔐 授权码管理中心</h2>
  <div class="card">
    <h3 style="color:#e9d5ff; margin-top:0; border-left: 3px solid #9333ea; padding-left: 10px;">1. 批量生成</h3>
    <label>管理员密码</label><input type="password" id="passGen" placeholder="请输入密码">
    <label>数量</label><input type="number" id="count" value="10" min="1" max="100">
    <label>单码测试次数</label>
    <select id="attempts"><option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option></select>
    <button onclick="generate()" id="genBtn">生成授权码</button>
    <div id="genResult" style="display:none; margin-top:15px;">
      <p class="ok">✅ 生成成功，请复制下表</p>
      <button class="btn-sec" style="width:auto; padding:5px 10px; font-size:12px;" onclick="copy('genBody')">复制表格</button>
      <table><thead><tr><th>授权码</th><th>次数</th><th>时间</th></tr></thead><tbody id="genBody"></tbody></table>
    </div>
  </div>
  <div class="card">
    <h3 style="color:#e9d5ff; margin-top:0; border-left: 3px solid #9333ea; padding-left: 10px;">2. 精准查询单个</h3>
    <label>管理员密码</label><input type="password" id="passSingle" placeholder="输入密码">
    <label>授权码 (6位)</label><input type="text" id="queryCode" maxlength="6" placeholder="例如: A7K9M2" style="text-transform:uppercase;">
    <button class="btn-sec" onclick="querySingle()" id="qsBtn">🔍 查询</button>
    <div id="singleRes" style="display:none; margin-top:15px; padding:15px; background:#1a1a1a; border-radius:8px; border: 1px solid #2a2a2a;">
      <p>授权码: <span id="rCode" class="code" style="font-size:18px; color:#c084fc;"></span></p>
      <p>总次数: <span id="rMax"></span> | 已用: <span id="rUsed" class="no"></span> | 剩余: <span id="rRemain" class="ok"></span></p>
    </div>
  </div>
  <div class="card">
    <h3 style="color:#e9d5ff; margin-top:0; border-left: 3px solid #9333ea; padding-left: 10px;">3. 批量查询所有</h3>
    <label>管理员密码</label><input type="password" id="passAll" placeholder="输入密码">
    <button class="btn-sec" onclick="queryAll()" id="qaBtn">🔄 刷新全部列表</button>
    <div id="listRes" style="display:none; margin-top:15px;">
      <button class="btn-sec" style="width:auto; padding:5px 10px; font-size:12px;" onclick="copy('listBody')">复制表格</button>
      <table><thead><tr><th>授权码</th><th>总/已用/剩余</th><th>状态</th><th>时间</th></tr></thead><tbody id="listBody"></tbody></table>
    </div>
  </div>
  <script>
    async function handleApi(url, body) {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }
    async function generate() {
      const pass = document.getElementById('passGen').value;
      if (!pass) return alert('请输入密码');
      const btn = document.getElementById('genBtn'); btn.disabled = true; btn.innerText = '生成中...';
      try {
        const data = await handleApi('/api/generate', { password: pass, count: parseInt(document.getElementById('count').value), attempts: parseInt(document.getElementById('attempts').value) });
        const tbody = document.getElementById('genBody'); tbody.innerHTML = '';
        const now = new Date().toLocaleString('zh-CN');
        data.codes.forEach(item => { tbody.innerHTML += `<tr><td class="code">${item.code}</td><td>${item.max}</td><td>${now}</td></tr>`; });
        document.getElementById('genResult').style.display = 'block';
      } catch (e) { alert('生成失败: ' + e.message); }
      finally { btn.disabled = false; btn.innerText = '生成授权码'; }
    }
    async function querySingle() {
      const pass = document.getElementById('passSingle').value; const code = document.getElementById('queryCode').value.trim();
      if (!pass || !code) return alert('请输入密码和授权码');
      const btn = document.getElementById('qsBtn'); btn.disabled = true; btn.innerText = '查询中...';
      document.getElementById('singleRes').style.display = 'none';
      try {
        const data = await handleApi('/api/query', { password: pass, code: code });
        if (data.type === 'single') {
          document.getElementById('rCode').innerText = data.data.code; document.getElementById('rMax').innerText = data.data.max;
          document.getElementById('rUsed').innerText = data.data.used; document.getElementById('rRemain').innerText = data.data.remaining;
          document.getElementById('singleRes').style.display = 'block';
        }
      } catch (e) { alert('查询失败: ' + e.message); }
      finally { btn.disabled = false; btn.innerText = '🔍 查询'; }
    }
    async function queryAll() {
      const pass = document.getElementById('passAll').value; if (!pass) return alert('请输入密码');
      const btn = document.getElementById('qaBtn'); btn.disabled = true; btn.innerText = '读取中...';
      try {
        const data = await handleApi('/api/query', { password: pass });
        if (data.type === 'all') {
          const tbody = document.getElementById('listBody'); tbody.innerHTML = '';
          data.list.forEach(item => {
            const status = item.remaining > 0 ? `<span class="ok">可用(剩${item.remaining})</span>` : `<span class="no">已用完</span>`;
            tbody.innerHTML += `<tr><td class="code">${item.code}</td><td>${item.max}/${item.used}/${item.remaining}</td><td>${status}</td><td style="font-size:11px;color:#888;">${item.created}</td></tr>`;
          });
          document.getElementById('listRes').style.display = 'block';
        }
      } catch (e) { alert('读取失败: ' + e.message); }
      finally { btn.disabled = false; btn.innerText = '🔄 刷新全部列表'; }
    }
    function copy(tbodyId) {
      let text = ''; document.querySelectorAll(`#${tbodyId} tr`).forEach(tr => { text += tr.innerText.replace(/\n/g, '\t') + '\n'; });
      navigator.clipboard.writeText(text).then(() => alert('✅ 已复制'));
    }
    document.getElementById('queryCode').addEventListener('input', function(e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  </script>
</body>
</html>
