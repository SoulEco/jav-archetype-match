<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>我的气质原型档案</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding-bottom:90px}
.wrap{max-width:520px;margin:auto;padding:22px}
.loading{text-align:center;padding:70px 0;color:#888}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 14px;font-size:12px;background:#171717;color:#d8b4fe;border:1px solid #292929;border-radius:8px;cursor:pointer}
.tabs button.on{background:#2e1065;border-color:#c084fc;color:#fff}
.page-card{background:#151515;border:1px solid #2a2a2a;border-radius:20px;padding:30px 24px 40px;margin-bottom:20px;position:relative;display:flex;flex-direction:column;overflow:hidden}
.page-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#9333ea,#c084fc)}
.test-index-tag{position:absolute;top:15px;right:15px;background:rgba(147,51,234,.18);color:#d8b4fe;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold}
.a-page-title{font-size:12px;color:#c084fc;letter-spacing:2px;text-align:center;margin:10px 0 15px}
.a-page-name{font-size:28px;font-weight:800;text-align:center;margin:0 0 8px;background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.a-page-desc{font-size:16px;font-weight:bold;text-align:center;color:#fff;margin:0 0 15px}
.radar-box{background:#0f0f0f;border-radius:12px;padding:10px 20px 20px;margin:10px 0;text-align:center;border:1px solid #222}
.radar-box h4{margin:0 0 10px;color:#d8b4fe;font-size:15px}
canvas{max-width:100%;height:auto;display:block;margin:0 auto}
.a-page-summary{font-size:14px;color:#ccc;line-height:1.6;text-align:center;background:rgba(147,51,234,.06);padding:16px;border-radius:8px;border-left:3px solid #9333ea;margin-top:10px}
.b-page-desc-large{font-size:24px;font-weight:900;text-align:center;margin:0 0 20px;line-height:1.3;background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.c-page-desc-medium{font-size:20px;font-weight:900;text-align:center;margin:0 0 20px;line-height:1.3;background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.b-page-dimensions-list{display:flex;flex-direction:column;gap:20px}
.b-dim-section{background:rgba(255,255,255,.03);border-radius:12px;padding:16px;border-left:3px solid #9333ea}
.b-dim-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:8px}
.b-dim-text{font-size:14px;color:#ccc;line-height:1.6}
.b-page-name-small{font-size:13px;text-align:center;color:#555;margin-top:25px;letter-spacing:2px}
.c-page-title{font-size:18px;font-weight:bold;color:#c084fc;text-align:center;margin:0 0 25px}
.dim-block{margin-bottom:24px;border-bottom:1px solid #222;padding-bottom:20px}
.dim-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.dim-header-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dim-name-score{font-size:15px;font-weight:bold;color:#fff}
.dim-champion{font-size:14px;font-weight:bold;color:#c084fc}
.bar-container{width:100%;height:10px;border:1px solid #9333ea;border-radius:5px;margin:10px 0;overflow:hidden}
.bar-fill{height:100%;background:#9333ea;border-radius:5px}
.dim-desc-text{font-size:12px;color:#888;line-height:1.5;margin-top:8px}
.note{font-size:11px;color:#777;margin-top:10px}
.cta{position:fixed;left:0;right:0;bottom:0;padding:14px 22px;background:rgba(10,10,10,.96);border-top:1px solid #262626;text-align:center}
.cta a{display:block;max-width:480px;margin:0 auto;padding:15px;border-radius:12px;background:linear-gradient(135deg,#9333ea,#c084fc);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div id="posters"><div class="loading">正在加载测试结果...</div></div>
</div>
<div class="cta"><a href="index.html">✨ 我也要测试 ✨</a></div>

<script src="data.js"></script>
<script src="render.js"></script>
<script>
let results = [], curIdx = 0;
const $ = id => document.getElementById(id);

function renderTabs() {
  $("tabs").innerHTML = results.map(function (rec, i) {
    return '<button class="' + (i === curIdx ? "on" : "") + '" onclick="switchTo(' + i + ')">第 ' + (i + 1) + ' 次 · ' + genLabel(rec.gen) + '</button>';
  }).join("");
}

function paint() {
  const rec = results[curIdx];
  $("posters").innerHTML = buildPages(rec, curIdx + 1, false);
  setTimeout(function () { paintRadar(rec); }, 120);
}

function switchTo(i) { curIdx = i; renderTabs(); paint(); window.scrollTo(0, 0); }

async function load() {
  const c = new URLSearchParams(location.search).get("code");
  if (!c) { $("posters").innerHTML = '<div class="loading">链接无效，请让朋友重新分享。</div>'; return; }
  try {
    const r = await fetch("/api/check", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: c.toUpperCase() }) });
    const d = await r.json();
    results = toArr(d.results);
    if (!r.ok || !results.length) { $("posters").innerHTML = '<div class="loading">未找到测试结果。</div>'; return; }
    curIdx = results.length - 1;
    renderTabs(); paint();
  } catch (e) {
    $("posters").innerHTML = '<div class="loading">加载失败，请稍后重试。</div>';
  }
}

load();
</script>
</body>
</html>
