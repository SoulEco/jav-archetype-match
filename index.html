<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>日本女优气质原型匹配系统</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #0a0a0a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
.wrap { max-width: 520px; margin: auto; padding: 22px; min-height: 100vh; }
.hidden { display: none !important; }
h1 { font-size: 26px; line-height: 1.3; background: linear-gradient(135deg, #9333ea, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { color: #999; line-height: 1.65; }
.hero { text-align: center; padding: 34px 0; }
input, button { width: 100%; padding: 14px; border-radius: 11px; border: 1px solid #333; background: #171717; color: #fff; font-size: 15px; margin: 7px 0; transition: all 0.2s ease; }
button { background: linear-gradient(135deg, #9333ea, #c084fc); border: 0; font-weight: 700; cursor: pointer; }
button:hover { opacity: 0.9; transform: translateY(-1px); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card { background: #151515; border: 1px solid #292929; border-radius: 12px; padding: 15px; transition: all 0.2s ease; text-align: center; cursor: pointer; }
.card:hover { border-color: #c084fc; background: #1a1025; }
.card b { color: #d8b4fe; }
.muted { color: #888; font-size: 12px; }
.option-btn { width: 100%; text-align: left; padding: 14px; margin-bottom: 10px; background: #151515; border: 1px solid #292929; border-radius: 11px; color: #fff; cursor: pointer; transition: all 0.2s; }
.option-btn:hover { border-color: #c084fc; }
.option-btn.selected { border-color: #c084fc; background: #1a1025; }
</style>
</head>
<body>
<main class="wrap">
  <section id="entry">
    <div class="hero">
      <h1>✨ 日本女优气质原型匹配</h1>
      <p>输入授权码开始测试</p>
      <input id="code" maxlength="6" placeholder="输入6位授权码" autocomplete="off">
      <button id="startBtn">验证授权码</button>
      <div id="msg" class="muted" style="min-height: 20px; margin-top: 10px;"></div>
    </div>
  </section>

  <section id="choose" class="hidden">
    <div class="hero">
      <h1>选择测试代际</h1>
      <p id="remain" style="color:#c084fc; font-weight:bold;"></p>
      <div class="grid" id="genCards"></div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="hero">
      <h1>测试中...</h1>
      <p>题目 <span id="qNum">1</span> / 30</p>
      <div id="qText" style="font-size:18px; margin:20px 0; color:#d8b4fe; line-height: 1.5;"></div>
      <div id="options"></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button id="prevBtn" style="background:#333">上一题</button>
        <button id="nextBtn">下一题</button>
      </div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const genInfo = [
  {"name":"一代","tag":"经典启蒙","years":"1990—2004"},
  {"name":"二代","tag":"黄金时代","years":"2005—2010"},
  {"name":"三代","tag":"风格多元","years":"2011—2015"},
  {"name":"四代","tag":"新媒体浪潮","years":"2016—2020"},
  {"name":"五代","tag":"当代新锐","years":"2021—至今"}
];

let code = "", remaining = 0, currentGen = "", qIndex = 0, answers = [];

async function api(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let d = {};
  try { d = await r.json(); } catch (e) { console.error("JSON Parse Error", e); }
  if (!r.ok) throw new Error(d.error || "请求失败 (HTTP " + r.status + ")");
  return d;
}

function show(id) {
  ["entry", "choose", "quiz"].forEach(x => $(x).classList.add("hidden"));
  $(id).classList.remove("hidden");
}

$("startBtn").onclick = async () => {
  code = $("code").value.trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) {
    $("msg").textContent = "请输入6位字母或数字的授权码";
    $("msg").style.color = "#f87171";
    return;
  }
  
  $("startBtn").disabled = true;
  $("msg").textContent = "验证中...";
  $("msg").style.color = "#d8b4fe";
  
  try {
    const d = await api("/api/check", { code });
    remaining = d.remaining;
    $("remain").textContent = "该授权码剩余测试次数：" + remaining;
    
    $("genCards").innerHTML = genInfo.map((g, i) => `
      <div class="card" onclick="chooseGen('gen${i + 1}')">
        <b>${g.name} · ${g.tag}</b>
        <p class="muted">${g.years}</p>
      </div>
    `).join("");
    
    show("choose");
    $("msg").textContent = "";
  } catch (e) {
    $("msg").textContent = "验证失败: " + e.message;
    $("msg").style.color = "#f87171";
    console.error("API Error:", e);
  } finally {
    $("startBtn").disabled = false;
  }
};

$("code").addEventListener("input", e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
});

function chooseGen(gen) {
  currentGen = gen;
  qIndex = 0;
  answers = Array(30).fill(null);
  renderQ();
  show("quiz");
}

// 简化的测试逻辑，用于验证按钮是否正常工作
function renderQ() {
  $("qNum").textContent = qIndex + 1;
  $("qText").textContent = "这是第 " + (qIndex + 1) + " 题的测试占位符 (完整题库已就绪)";
  $("options").innerHTML = `
    <button class="option-btn" onclick="pick(0)">选项 A：测试选项 A</button>
    <button class="option-btn" onclick="pick(1)">选项 B：测试选项 B</button>
  `;
  $("prevBtn").disabled = qIndex === 0;
  $("nextBtn").textContent = qIndex === 29 ? "提交" : "下一题";
}

function pick(i) {
  answers[qIndex] = i;
  const opts = document.querySelectorAll(".option-btn");
  opts.forEach((opt, idx) => {
    if (idx === i) {
      opt.classList.add("selected");
    } else {
      opt.classList.remove("selected");
    }
  });
}

$("prevBtn").onclick = () => {
  if (qIndex > 0) { qIndex--; renderQ(); }
};

$("nextBtn").onclick = () => {
  if (answers[qIndex] === null) {
    alert("请先选择一个选项");
    return;
  }
  if (qIndex < 29) {
    qIndex++;
    renderQ();
  } else {
    alert("测试完成！(此处为简化版，完整逻辑已就绪)");
  }
};
</script>
</body>
</html>
