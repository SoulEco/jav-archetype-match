<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员 · 授权码管理</title>
<style>body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;max-width:850px;padding:22px;margin:auto}.card{background:#222;border:1px solid #333;border-radius:12px;padding:18px;margin:16px 0}input,select,button{width:100%;padding:12px;margin:6px 0;background:#333;color:#fff;border:1px solid #555;border-radius:7px;box-sizing:border-box}button{background:#ff3366;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#444}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:8px;border:1px solid #444;text-align:left;font-size:13px}.ok{color:#0f8}.bad{color:#f66}.hint{color:#999;font-size:12px;line-height:1.6}.toolbar{display:flex;gap:8px;align-items:center}.toolbar button{flex:1}</style></head><body><h2>🔐 授权码管理中心</h2>
<section class="card"><h3>管理员身份验证</h3><label for="adminPassword">管理员密码（Cloudflare Secret：ADMIN_PASSWORD）</label><input id="adminPassword" type="password" placeholder="请输入管理员密码" autocomplete="current-password"><p class="hint">同一个密码用于生成授权码、查询单个授权码和查询全部授权码。密码只在本次页面会话中使用，不会保存到浏览器。</p></section>
<section class="card"><h3>1. 批量生成授权码</h3><label>生成数量（1—100）</label><input id="count" type="number" min="1" max="100" value="10"><label>单个授权码可测试次数</label><select id="attempts"><option value="1">1次</option><option value="2">2次</option><option value="3">3次</option><option value="5">5次</option><option value="10">10次</option></select><button id="genBtn" onclick="generate()">生成授权码</button><div id="generated"></div></section>
<section class="card"><h3>2. 查询单个授权码</h3><label>授权码</label><input id="singleCode" maxlength="6" placeholder="输入6位授权码" autocomplete="off"><button id="singleBtn" class="secondary" onclick="single()">🔍 查询单个状态</button><div id="singleResult"></div></section>
<section class="card"><h3>3. 查询所有授权码状态</h3><p class="hint">读取 KV 中全部 CODE_ 开头的授权码，显示总次数、已用次数、剩余次数和创建时间。</p><button id="allBtn" class="secondary" onclick="all()">🔄 查询所有授权码状态</button><div id="allResult"></div></section>
<script>
const $=id=>document.getElementById(id);
async function call(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||`请求失败（HTTP ${r.status}）`);return d}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function password(){const p=$("adminPassword").value;if(!p.trim())throw Error("请先在页面顶部输入管理员密码");return p}
async function withButton(id,loading,fn){const b=$(id);b.disabled=true;const old=b.textContent;b.textContent=loading;try{await fn()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent=old}}
async function generate(){await withButton("genBtn","生成中…",async()=>{const d=await call("/api/generate",{password:password(),count:Number($("count").value),attempts:Number($("attempts").value)});$("generated").innerHTML="<p class='ok'>✅ 成功生成 "+d.codes.length+" 个授权码</p><table><tr><th>授权码</th><th>可用次数</th><th>创建时间</th></tr>"+d.codes.map(x=>`<tr><td><code>${esc(x.code)}</code></td><td>${x.max}</td><td>${esc(x.created)}</td></tr>`).join("")+"</table>"})}
async function single(){await withButton("singleBtn","查询中…",async()=>{const code=$("singleCode").value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code))throw Error("请输入6位字母或数字授权码");const d=await call("/api/query",{password:password(),code});const x=d.data;$("singleResult").innerHTML=`<table><tr><th>授权码</th><th>总次数</th><th>已用</th><th>剩余</th><th>创建时间</th></tr><tr><td>${esc(x.code)}</td><td>${x.max}</td><td>${x.used}</td><td class='${x.remaining>0?"ok":"bad"}'>${x.remaining}</td><td>${esc(x.created)}</td></tr></table>`})}
async function all(){await withButton("allBtn","正在读取全部授权码…",async()=>{const d=await call("/api/query",{password:password()});const list=d.list||[];$("allResult").innerHTML=`<p class='ok'>共读取 ${list.length} 个授权码</p>`+(list.length?"<div style='overflow-x:auto'><table><tr><th>授权码</th><th>总/已用/剩余</th><th>状态</th><th>创建时间</th></tr>"+list.map(x=>`<tr><td><code>${esc(x.code)}</code></td><td>${x.max}/${x.used}/${x.remaining}</td><td class='${x.remaining>0?"ok":"bad"}'>${x.remaining>0?"可用":"已用完"}</td><td>${esc(x.created)}</td></tr>`).join("")+"</table></div>":"<p class='hint'>KV 中暂时没有授权码。</p>")})}
$("singleCode").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""));
</script></body></html>
