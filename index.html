<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>日本女优气质原型匹配系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;height:100vh;overflow:hidden}
.wrap{max-width:520px;margin:0 auto;padding:22px;height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}
.wrap>section:not(#result):not(.hidden){flex:1 1 auto;min-height:0;overflow-y:auto}
h1{font-size:26px;line-height:1.3;background:linear-gradient(135deg,#9333ea,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#999;line-height:1.65}
.hero{text-align:center;padding:34px 0}
input,button{width:100%;padding:14px;border-radius:11px;border:1px solid #333;background:#171717;color:#fff;font-size:15px;margin:7px 0;transition:all .2s ease}
button{background:linear-gradient(135deg,#9333ea,#c084fc);border:0;font-weight:700;cursor:pointer}
button:hover{opacity:.9;transform:translateY(-1px)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.ghost{background:#1a1a1a!important;border:1px solid #333!important;color:#d8b4fe!important}
.ghost:hover{background:#2e1065!important;border-color:#c084fc!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#151515;border:1px solid #292929;border-radius:12px;padding:15px;text-align:center;cursor:pointer;transition:all .2s ease}
.card:hover{border-color:#c084fc;background:#1a1025}
.card b{color:#d8b4fe}
.muted{color:#888;font-size:12px}
.note{font-size:11px;color:#777;margin-top:10px}
a{color:#d8b4fe;text-decoration:none}
a:hover{color:#fff;text-decoration:underline}
.progress{height:5px;background:#292929;border-radius:5px;margin:18px 0}
.fill{height:100%;background:linear-gradient(90deg,#9333ea,#c084fc);width:0;transition:width .3s ease}
.option{display:block;width:100%;text-align:left;line-height:1.5;margin:10px 0;cursor:pointer;background:#151515;border:1px solid #292929;border-radius:12px;padding:15px;color:#fff;font-size:14px;font-weight:400}
.option:hover{border-color:#c084fc}
.option.sel{border-color:#c084fc;background:#2e1065}
.row{display:flex;gap:10px}
.row button{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{width:auto;padding:8px 14px;font-size:12px;background:#171717;color:#d8b4fe;margin:0;border:1px solid #292929;border-radius:8px;font-weight:400}
.tabs button.on{background:#2e1065;border-color:#c084fc;color:#fff}
#result{flex:1 1 auto;min-height:0;flex-direction:column;overflow:hidden}
#result:not(.hidden){display:flex}
#result>.tabs{flex:0 0 auto}
.result-container{flex:1 1 0;height:0;min-height:0;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none;-ms-overflow-style:none;position:relative}
.result-container::-webkit-scrollbar{display:none}
.page-card{min-height:100%;scroll-snap-align:start;background:#151515;border:1px solid #2a2a2a;border-radius:20px;padding:30px 24px 60px;margin-bottom:20px;position:relative;display:flex;flex-direction:column;overflow:hidden}
.page-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#9333ea,#c084fc);border-radius:20px 20px 0 0}
.test-index-tag{position:absolute;top:15px;right:15px;background:rgba(147,51,234,.18);color:#d8b4fe;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold}
.a-page-title{font-size:12px;color:#c084fc;letter-spacing:2px;text-align:center;margin:10px 0 15px}
.a-page-name{font-size:28px;font-weight:800;text-align:center;margin:0 0 8px;background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.a-page-desc{font-size:16px;font-weight:bold;text-align:center;color:#fff;margin:0 0 15px}
.radar-box{background:#0f0f0f;border-radius:12px;padding:10px 20px 20px;margin:10px 0;text-align:center;flex-shrink:0;border:1px solid #222}
.radar-box h4{margin:0 0 10px;color:#d8b4fe;font-size:15px}
canvas{max-width:100%;height:auto;display:block;margin:0 auto}
.a-page-summary{font-size:14px;color:#ccc;line-height:1.6;text-align:center;background:rgba(147,51,234,.06);padding:16px;border-radius:8px;border-left:3px solid #9333ea;margin-top:10px}
.b-page-desc-large{font-size:24px;font-weight:900;text-align:center;margin:0 0 20px;line-height:1.3;letter-spacing:1px;background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.c-page-desc-medium{font-size:20px;font-weight:900;text-align:center;margin:0 0 20px;line-height:1.3;background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.b-page-dimensions-list{display:flex;flex-direction:column;gap:20px;flex:1;overflow-y:auto;padding-right:5px}
.b-dim-section{background:rgba(255,255,255,.03);border-radius:12px;padding:16px;border-left:3px solid #9333ea}
.b-dim-title{font-size:18px;font-weight:700;color:#fff;margin-bottom:8px}
.b-dim-text{font-size:14px;color:#ccc;line-height:1.6}
.b-page-name-small{font-size:13px;text-align:center;color:#555;margin-top:25px;letter-spacing:2px}
.c-page-title{font-size:18px;font-weight:bold;color:#c084fc;text-align:center;margin:0 0 25px}
.dim-block{margin-bottom:24px;border-bottom:1px solid #222;padding-bottom:20px}
.dim-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.dim-header-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dim-name-score{font-size:15px;font-weight:bold;color:#fff}
.dim-champion{font-size:14px;font-weight:bold;color:#c084fc}
.bar-container{width:100%;height:10px;border:1px solid #9333ea;border-radius:5px;margin:10px 0;overflow:hidden}
.bar-fill{height:100%;background:#9333ea;border-radius:5px}
.dim-desc-text{font-size:12px;color:#888;line-height:1.5;margin-top:8px}
.page-f{justify-content:center;align-items:center;padding:20px 24px}
.page-f .test-index-tag{display:none}
.f-actions{width:100%;max-width:320px;display:flex;flex-direction:column;gap:12px}
.btn-save-poster,.btn-share-link,.btn-retest{display:block;width:100%;padding:14px;margin:0;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-save-poster{background:linear-gradient(135deg,#9333ea,#c084fc);color:#fff;border:0}
.btn-share-link{background:#241436;color:#d8b4fe;border:1px solid #9333ea}
.btn-retest{background:#1a1a1a;color:#fff;border:1px solid #333}
.btn-more{display:block;width:100%;padding:14px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;font-size:15px;font-weight:bold;text-align:center;text-decoration:none}
.btn-more:hover{opacity:.9;text-decoration:none}
.f-tip{color:#666;font-size:12px;line-height:1.6;text-align:center;margin:8px 0 0}
#scrollNav{position:fixed;right:15px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:15px;z-index:999}
.scroll-btn{width:44px;height:44px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s ease;opacity:0;pointer-events:none;transform:scale(.8)}
.scroll-btn.visible{opacity:1;pointer-events:auto;transform:scale(1)}
.scroll-btn:hover{background:rgba(147,51,234,.35);border-color:#c084fc}
.scroll-btn svg{width:24px;height:24px;fill:#fff}
#modal,#copyModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#modalScroll{width:92%;max-width:420px;max-height:70vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
#modalScroll img{width:100%;border-radius:12px}
.closeX{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
.modalTip{color:#d8b4fe;font-size:14px;font-weight:bold;margin:0 0 12px;text-align:center}
#copyArea{width:92%;max-width:420px;height:150px;background:#151515;color:#fff;border:1px solid #9333ea;border-radius:10px;padding:12px;font-size:13px;line-height:1.6}
#copyBtn{width:auto;max-width:200px;margin-top:12px}
</style>
</head>
<body>

<div id="scrollNav" class="hidden">
  <div class="scroll-btn scroll-up" onclick="scrollPage(-1)"><svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg></div>
  <div class="scroll-btn scroll-down" onclick="scrollPage(1)"><svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></div>
</div>

<main class="wrap">
  <section id="entry">
    <div class="hero">
      <h1>✨ 日本女优气质原型匹配</h1>
      <p>30道代际专属情境题 · 六维偏好画像 · 综合原型与维度冠军</p>
      <input id="code" maxlength="6" placeholder="输入6位授权码" autocomplete="off">
      <button id="start">开始测试</button>
      <div id="msg" class="muted" style="min-height:18px;margin-top:10px;"></div>
    </div>
  </section>

  <section id="choose" class="hidden">
    <h1>选择测试代际</h1>
    <p id="remain" style="color:#c084fc;font-weight:bold;"></p>
    <div class="grid" id="genCards"></div>
    <button id="viewResultBtn" class="ghost hidden">📂 查看已测代际结果</button>
    <p class="note">按女优首次正式出道的大致年份划分。候选人均为成年公众人物；人物原型是娱乐性风格类比，不代表真人性格或私生活。</p>
  </section>

  <section id="quiz" class="hidden">
    <div class="muted">第 <span id="num">1</span> / 30 题</div>
    <div class="progress"><div id="fill" class="fill"></div></div>
    <h2 id="question" style="font-size:18px;line-height:1.5;margin-bottom:20px;"></h2>
    <div id="options"></div>
    <div class="row">
      <button id="prev" class="ghost">← 上一题</button>
      <button id="next">下一题 →</button>
    </div>
  </section>

  <section id="confirm" class="hidden">
    <div class="hero">
      <div style="font-size:56px;margin-bottom:10px;">🎯</div>
      <h1>你已完成全部 30 题</h1>
      <p>系统将解析你的六维偏好向量，在候选原型中匹配你的本命原型。</p>
      <button id="calcBtn">开始测算</button>
      <button id="backQuizBtn" class="ghost">返回检查答案</button>
    </div>
  </section>

  <section id="calc" class="hidden">
    <div class="hero">
      <div style="font-size:56px;margin-bottom:10px;">💫</div>
      <h1>正在生成你的专属档案</h1>
      <div class="progress"><div id="calcFill" class="fill"></div></div>
      <div id="calcText" class="muted" style="color:#c084fc;">正在解析你的 30 个选择...</div>
      <div id="calcPct" class="muted" style="margin-top:6px;">0%</div>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="tabs" id="resultTabs"></div>
    <div class="result-container" id="resultContent"></div>
  </section>
</main>

<div id="modal">
  <span class="closeX" onclick="closeModal()">×</span>
  <p class="modalTip">👇 长按图片保存到相册 👇</p>
  <div id="modalScroll"></div>
</div>

<div id="copyModal">
  <span class="closeX" onclick="closeCopy()">×</span>
  <p class="modalTip">👇 复制下面文案发给朋友 👇</p>
  <textarea id="copyArea" readonly></textarea>
  <button id="copyBtn">一键复制</button>
</div>

<script src="data.js"></script>
<script src="render.js"></script>
<script>
let code = "", remaining = 0, currentGen = "", qIndex = 0, answers = [], serverResults = [], curIdx = 0;
const $ = id => document.getElementById(id);

async function api(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  let d = {};
  try { d = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error(d.error || ("请求失败 HTTP " + r.status));
  return d;
}

function show(id) {
  ["entry", "choose", "quiz", "confirm", "calc", "result"].forEach(function (x) { $(x).classList.toggle("hidden", x !== id); });
  $("scrollNav").classList.toggle("hidden", id !== "result");
  window.scrollTo(0, 0);
}

function checkScroll() {
  const c = document.querySelector(".result-container");
  const up = document.querySelector(".scroll-up"), dn = document.querySelector(".scroll-down");
  if (!c || !up || !dn) return;
  up.classList.toggle("visible", c.scrollTop > 50);
  dn.classList.toggle("visible", c.scrollTop < c.scrollHeight - c.clientHeight - 50);
}

function initScrollButtons() {
  const c = document.querySelector(".result-container");
  if (!c) return;
  if (c.dataset.bound !== "1") { c.dataset.bound = "1"; c.addEventListener("scroll", checkScroll); }
  checkScroll();
}

function scrollPage(d) {
  const c = document.querySelector(".result-container");
  if (!c) return;
  const card = c.querySelector(".page-card");
  c.scrollBy({ top: d * (card ? card.offsetHeight + 20 : c.clientHeight), behavior: "smooth" });
}

function renderGenCards() {
  $("genCards").innerHTML = genInfo.map(function (g, i) {
    const n = i + 1;
    return '<div class="card" onclick="chooseGen(\'gen' + n + '\')">'
      + '<b>' + g.name + ' · ' + g.tag + '</b>'
      + '<p class="muted">' + g.years + '</p>'
      + '<span class="muted">30道专属题</span>'
      + '<p><a href="gen' + n + '.html" onclick="event.stopPropagation()">📖 查看候选池</a></p>'
      + '</div>';
  }).join("");
}

function gotoChoose() {
  $("remain").textContent = "该授权码剩余测试次数：" + remaining;
  renderGenCards();
  $("viewResultBtn").classList.toggle("hidden", serverResults.length === 0);
  show("choose");
}

$("start").onclick = async function () {
  code = $("code").value.trim().toUpperCase();
  if (!/^[A-Z0-9]{6}$/.test(code)) { $("msg").textContent = "请输入6位授权码"; $("msg").style.color = "#f87171"; return; }
  $("start").disabled = true;
  $("msg").textContent = "验证中..."; $("msg").style.color = "#d8b4fe";
  try {
    const d = await api("/api/check", { code: code });
    remaining = d.remaining || 0;
    serverResults = toArr(d.results);
    if (remaining > 0) { gotoChoose(); $("msg").textContent = ""; }
    else if (serverResults.length > 0) { showResultView(); }
    else { $("msg").textContent = "该授权码次数已用完，且无历史记录"; $("msg").style.color = "#f87171"; }
  } catch (e) {
    $("msg").textContent = "验证失败: " + e.message; $("msg").style.color = "#f87171";
  } finally { $("start").disabled = false; }
};

$("code").addEventListener("input", function (e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""); });
$("viewResultBtn").onclick = function () { showResultView(); };

function chooseGen(gen) {
  if (remaining <= 0) { alert("测试次数已用完，无法再次测试"); return; }
  currentGen = gen; qIndex = 0; answers = new Array(30).fill(null);
  renderQ(); show("quiz");
}

function renderQ() {
  const q = questions[currentGen][qIndex];
  $("num").textContent = qIndex + 1;
  $("fill").style.width = ((qIndex + 1) / 30 * 100) + "%";
  $("question").textContent = q.q;
  $("options").innerHTML = q.opts.map(function (o, i) {
    return '<button class="option ' + (answers[qIndex] === i ? "sel" : "") + '" onclick="pick(' + i + ')">'
      + String.fromCharCode(65 + i) + '. ' + o.t + '</button>';
  }).join("");
  $("prev").disabled = (qIndex === 0);
  $("next").textContent = (qIndex === 29) ? "提交答案" : "下一题 →";
  $("next").disabled = (answers[qIndex] === null);
}

function pick(i) { answers[qIndex] = i; renderQ(); }
$("prev").onclick = function () { if (qIndex > 0) { qIndex--; renderQ(); } };
$("next").onclick = function () {
  if (answers[qIndex] === null) return;
  if (qIndex < 29) { qIndex++; renderQ(); } else { show("confirm"); }
};
$("backQuizBtn").onclick = function () { qIndex = 29; renderQ(); show("quiz"); };
$("calcBtn").onclick = function () { startCalc(); };

function startCalc() {
  show("calc");
  const steps = ["正在解析你的 30 个选择...", "构建六维偏好向量场...", "扫描候选原型图谱...", "计算多维空间共振频率...", "生成专属档案海报..."];
  let p = 0, last = -1;
  $("calcFill").style.width = "0%"; $("calcPct").textContent = "0%"; $("calcText").textContent = steps[0];
  const iv = setInterval(function () {
    p += 100 / 30;
    if (p >= 100) {
      clearInterval(iv);
      $("calcFill").style.width = "100%"; $("calcPct").textContent = "100%";
      setTimeout(finish, 300); return;
    }
    $("calcFill").style.width = p + "%";
    $("calcPct").textContent = Math.floor(p) + "%";
    const si = Math.min(steps.length - 1, Math.floor(p / 100 * steps.length));
    if (si !== last) { $("calcText").textContent = steps[si]; last = si; }
  }, 100);
}

function calcScores() {
  const raw = new Array(6).fill(0), mx = new Array(6).fill(0);
  answers.forEach(function (a, i) {
    const q = questions[currentGen][i];
    let hi = 0;
    q.opts.forEach(function (o) { if (o.v > hi) hi = o.v; });
    raw[q.dim] += q.opts[a].v;
    mx[q.dim] += hi;
  });
  return { raw: raw, max: mx, scores: raw.map(function (v, i) { return pct(v, mx[i]); }) };
}

function distance(a, b) {
  const w = [1.15, 1.1, 1.05, 1.1, 1, 1.15];
  let s = 0, den = 0;
  for (let i = 0; i < 6; i++) { s += w[i] * Math.pow(a[i] - b[i] * 10, 2); den += w[i]; }
  return Math.sqrt(s / den);
}

function match(sc) {
  const list = people[currentGen];
  const ranked = list.map(function (p) { return { p: p, dist: distance(sc, p.scores) }; }).sort(function (a, b) { return a.dist - b.dist; });
  const champs = dims.map(function (d, i) {
    return list.map(function (p) { return { p: p, delta: Math.abs(sc[i] - p.scores[i] * 10) }; }).sort(function (a, b) { return a.delta - b.delta; })[0].p;
  });
  return { winner: ranked[0], runner: ranked[1], champs: champs };
}

function pack(x) { return { name: x.name, desc: x.desc, summary: x.summary, detail: x.detail, aspects: x.aspects || {} }; }

async function finish() {
  if (answers.some(function (x) { return x === null; })) { alert("还有题目未作答"); show("quiz"); return; }
  const S = calcScores(), m = match(S.scores);
  const payload = {
    scores: S.scores, raw: S.raw, max: S.max,
    winner: pack(m.winner.p),
    runner: { name: m.runner.p.name, gap: Number((m.runner.dist - m.winner.dist).toFixed(2)) },
    champions: m.champs.map(pack),
    timestamp: new Date().toISOString()
  };
  try {
    const d = await api("/api/save", { code: code, gen: currentGen, resultData: payload });
    remaining = (typeof d.remaining === "number") ? d.remaining : Math.max(0, remaining - 1);
    serverResults.push({ gen: currentGen, result: d.result || payload });
  } catch (e) { alert("保存失败：" + e.message); gotoChoose(); return; }
  showResultView();
}

function showResultView() {
  if (!serverResults.length) { alert("暂无已测结果"); return; }
  curIdx = serverResults.length - 1;
  renderTabs(); renderCurrent(); show("result");
}

function renderTabs() {
  $("resultTabs").innerHTML = serverResults.map(function (rec, i) {
    return '<button class="' + (i === curIdx ? "on" : "") + '" onclick="switchResult(' + i + ')">第 ' + (i + 1) + ' 次 · ' + genLabel(rec.gen) + '</button>';
  }).join("");
}

function switchResult(i) {
  curIdx = i; renderTabs(); renderCurrent();
  const c = document.querySelector(".result-container"); if (c) c.scrollTop = 0;
}

function renderCurrent() {
  const rec = serverResults[curIdx];
  if (!rec) return;
  $("resultContent").innerHTML = buildPages(rec, curIdx + 1, true);
  setTimeout(function () { paintRadar(rec); initScrollButtons(); checkScroll(); }, 150);
}

async function captureCard(el) {
  const om = el.style.minHeight, oh = el.style.height;
  el.style.minHeight = "0"; el.style.height = "auto";
  try {
    const cv = await html2canvas(el, { scale: 2, backgroundColor: "#151515", useCORS: true, logging: false });
    return cv.toDataURL("image/png");
  } finally { el.style.minHeight = om; el.style.height = oh; }
}

async function saveAllPosters(btn) {
  const cards = document.querySelectorAll("#resultContent .page-card.saveable");
  if (!cards.length) return;
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "⏳ 生成 5 张海报中...";
  try {
    const imgs = [];
    for (let i = 0; i < cards.length; i++) { imgs.push(await captureCard(cards[i])); }
    const mobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    if (mobile) {
      $("modalScroll").innerHTML = imgs.map(function (d, i) {
        return '<img src="' + d + '"><small style="color:#888;text-align:center;display:block">第 ' + (i + 1) + ' 张 / 共 ' + imgs.length + ' 张</small>';
      }).join("");
      $("modal").style.display = "flex";
    } else {
      imgs.forEach(function (d, i) {
        const a = document.createElement("a");
        a.download = "jav-archetype-" + (curIdx + 1) + "-page" + (i + 1) + ".png";
        a.href = d; a.click();
      });
    }
  } catch (e) { alert("生成海报失败，请尝试手动截图"); console.error(e); }
  finally { btn.disabled = false; btn.textContent = old; }
}

function closeModal() { $("modal").style.display = "none"; }
function closeCopy() { $("copyModal").style.display = "none"; }

function shareResult() {
  const n = normResult(serverResults[curIdx]);
  const url = location.origin + "/share.html?code=" + encodeURIComponent(code);
  $("copyArea").value = '我的测试结果是"' + (n.w.desc || n.w.name) + '"。' + (n.w.summary || "") + ' 我的测试结果：' + url;
  $("copyModal").style.display = "flex";
  setTimeout(function () { const t = $("copyArea"); t.focus(); t.select(); }, 50);
}

$("copyBtn").onclick = function () {
  const t = $("copyArea"); t.focus(); t.select();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t.value).then(function () { alert("✅ 已复制，粘贴发给朋友即可"); }).catch(function () { alert("请长按文本框手动复制"); });
  } else { alert("请长按文本框手动复制"); }
};

function backToTest() { if (remaining > 0) { gotoChoose(); } else { location.reload(); } }
</script>
