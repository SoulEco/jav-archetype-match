let code="", remaining=0, currentGen="", qIndex=0, answers=[], saved={};
const $=id=>document.getElementById(id);

async function api(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  let d={};
  try{d=await r.json()}catch{}
  if(!r.ok) throw Error(d.error||"请求失败");
  return d;
}

function show(id){
  ["entry","choose","quiz","result"].forEach(x=>$(x).classList.toggle("hidden",x!==id));
}

$("start").onclick=async()=>{
  code=$("code").value.trim().toUpperCase();
  if(!/^[A-Z0-9]{6}$/.test(code)) return $("msg").textContent="请输入6位授权码";
  $("start").disabled=true;
  try{
    const d=await api("/api/check",{code});
    remaining=d.remaining;
    if(d.has_result && Array.isArray(d.results)){
      d.results.forEach(x=>{
        if(x.gen && x.result) saved[x.gen]=x.result;
      });
    }
    $("remain").textContent=`该授权码剩余测试次数：${remaining}`;
    $("genCards").innerHTML=GEN_INFO.map((g,i)=>`
      <div class="card" onclick="chooseGen('gen${i+1}')">
        <b>${g.name} · ${g.tag}</b>
        <p class="muted">${g.years}</p>
        <span class="muted">30道专属题</span>
        <p><a href="gen${i+1}.html" onclick="event.stopPropagation()">查看候选池</a></p>
      </div>
    `).join("");
    show("choose");
  }catch(e){
    $("msg").textContent=e.message;
  }finally{
    $("start").disabled=false;
  }
};

$("code").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""));

function chooseGen(gen){
  currentGen=gen;
  qIndex=0;
  answers=Array(30).fill(null);
  renderQ();
  show("quiz");
}

function renderQ(){
  const q=QUESTIONS[currentGen][qIndex];
  $("num").textContent=qIndex+1;
  $("fill").style.width=((qIndex+1)/30*100)+"%";
  $("question").textContent=q.q;
  $("options").innerHTML=q.opts.map((o,i)=>`<button class="option ${answers[qIndex]===i?"sel":""}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o.t}</button>`).join("");
  $("prev").disabled=qIndex===0;
  $("next").textContent=qIndex===29?"提交并生成海报":"下一题";
  $("next").disabled=answers[qIndex]===null;
}

function pick(i){
  answers[qIndex]=i;
  renderQ();
}

$("prev").onclick=()=>{
  if(qIndex>0){
    qIndex--;
    renderQ();
  }
};

$("next").onclick=()=>{
  if(answers[qIndex]===null) return;
  if(qIndex<29){
    qIndex++;
    renderQ();
  }else{
    finish();
  }
};

function calcScores(){
  const totals=Array(6).fill(0), maxes=Array(6).fill(0);
  answers.forEach((a,i)=>{
    const q=QUESTIONS[currentGen][i], d=q.dim;
    totals[d]+=q.opts[a].v;
    maxes[d]+=10;
  });
  return totals.map((v,i)=>Math.round(v/(maxes[i]||50)*100));
}

function distance(a,b){
  const weights=[1.15,1.1,1.05,1.1,1,1.15];
  let sum=0, den=0;
  for(let i=0;i<6;i++){
    sum+=weights[i]*Math.pow(a[i]-b[i]*10,2);
    den+=weights[i];
  }
  return Math.sqrt(sum/den);
}

function match(scores){
  const people=PEOPLE[currentGen];
  const ranked=people.map(p=>({p,dist:distance(scores,p.scores)})).sort((a,b)=>a.dist-b.dist);
  const championByDim=DIMS.map((d,i)=>people.map(p=>({p,delta:Math.abs(scores[i]-p.scores[i]*10)})).sort((a,b)=>a.delta-b.delta)[0].p);
  return {winner:ranked[0], runner:ranked[1], championByDim};
}

async function finish(){
  if(answers.some(x=>x===null)) return;
  const scores=calcScores(), m=match(scores);
  const payload={scores, answers, winner:m.winner.p.name, champions:m.championByDim.map(p=>p.name), timestamp:new Date().toISOString()};
  try{
    await api("/api/save",{code, gen:currentGen, resultData:payload});
    remaining=Math.max(0, remaining-1);
  }catch(e){
    alert("保存失败："+e.message);
    return;
  }
  renderResult(scores,m);
  show("result");
}

function renderResult(scores,m){
  const p=m.winner.p;
  const info=GEN_INFO[Number(currentGen.slice(3))-1];
  $("resultTabs").innerHTML=`
    <button onclick="window.scrollTo({top:0,behavior:'smooth'})">综合结果</button>
    <button onclick="$('dimPoster').scrollIntoView({behavior:'smooth'})">六维冠军</button>
    <button onclick="$('profilePoster').scrollIntoView({behavior:'smooth'})">人格画像</button>
  `;
  $("posters").innerHTML=`
    <article class="poster">
      <div class="kicker">YOUR ARCHETYPE · ${info.name}</div>
      <div class="winner">${p.name}</div>
      <p style="text-align:center; color:#ccc;">${p.summary}</p>
      <div class="panel" style="margin-top:20px;">
        <b style="color:#d8b4fe;">综合匹配原型</b>
        <p style="margin-top:8px;">${p.desc}</p>
        <p class="note">匹配算法根据你的答题向量与候选原型向量计算相似度。匹配度仅为娱乐性结果，不是科学测评。</p>
      </div>
      <h3 style="margin-top:25px; color:#d8b4fe;">你的六维偏好画像</h3>
      ${DIMS.map((d,i)=>`
        <div class="dim">
          <b>${d.name}</b>
          <span style="float:right; color:#c084fc; font-weight:bold;">${scores[i]}分</span>
          <div class="score"><i style="width:${scores[i]}%"></i></div>
          <small>${d.desc}</small>
        </div>
      `).join("")}
      <p class="note">第二接近原型：<strong>${m.runner.p.name}</strong>。两者距离差：${(m.runner.dist-m.winner.dist).toFixed(2)}。</p>
      <p class="note">长按本页可保存海报；建议浏览器打印为PDF保存。</p>
    </article>

    <article class="poster" id="dimPoster">
      <div class="kicker">DIMENSION CHAMPIONS</div>
      <div class="winner">六维专属原型榜</div>
      ${DIMS.map((d,i)=>`
        <div class="dim">
          <b>${d.name}</b>
          <div class="winner" style="font-size:22px; text-align:left; margin:10px 0;">${m.championByDim[i].name}</div>
          <small>${d.desc}</small>
          <p style="margin-top:8px; color:#ccc;">${m.championByDim[i].detail || m.championByDim[i].summary}</p>
        </div>
      `).join("")}
    </article>

    <article class="poster" id="profilePoster">
      <div class="kicker">YOUR PROFILE</div>
      <div class="winner">你的魅力画像</div>
      <p style="color:#ccc; line-height:1.7;">${p.detail}</p>
      <p style="margin-top:15px; color:#ccc;">你的突出维度是<strong style="color:#c084fc;">${DIMS[scores.indexOf(Math.max(...scores))].name}</strong>。这代表你在相应情境选择中更常采用该维度对应的策略。</p>
      <p class="note">娱乐性自我探索内容，不用于判断他人或作现实决策。</p>
    </article>
  `;
}
</script>
</body>
